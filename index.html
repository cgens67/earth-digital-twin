<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Solar System Twin</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">

    <!-- Bulletproof ES Module Loader for Mobile -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <!-- 3D Canvas -->
    <div id="webgl-container"></div>

    <!-- UI Overlay (MD3) -->
    <main class="ui-container">
        
        <!-- App Bar -->
        <header class="app-bar">
            <div>
                <h1 class="title">Solar System</h1>
                <p class="subtitle">True Scale Simulation</p>
            </div>
        </header>

        <!-- Floating Action Button -->
        <button id="sun-btn" class="fab" title="Toggle Sun">
            <span class="material-symbols-outlined" id="sun-icon">light_mode</span>
        </button>

        <!-- Control Panel (Bottom Sheet on Mobile, Sidebar on Desktop) -->
        <section class="control-panel">
            <div class="panel-header">
                <h2>Simulation Controls</h2>
                <div id="status-badge" class="badge badge-normal">Gravity: Normal</div>
            </div>

            <!-- Time Control -->
            <div class="control-group">
                <div class="control-label">
                    <span class="material-symbols-outlined">fast_forward</span>
                    <span>Time Speed</span>
                </div>
                <input type="range" id="time-slider" class="md-slider" min="0" max="1000" value="100">
            </div>

            <!-- Camera Focus -->
            <div class="control-group">
                <div class="control-label">
                    <span class="material-symbols-outlined">explore</span>
                    <span>Focus Camera</span>
                </div>
                <div class="chips-wrapper" id="planet-chips">
                    <!-- Chips inserted by JS -->
                </div>
            </div>
        </section>

    </main>

    <script type="module" src="main.js"></script>
</body>
</html>
