<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Solar System Digital Twin</title>
    
    <!-- Material Design Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="canvas-container"></div>

    <!-- UI Overlay (Material Design 3) -->
    <div class="ui-layer">
        
        <!-- Sidebar -->
        <div class="sidebar">
            <header class="top-bar">
                <h1>Solar System Twin</h1>
                <span class="subtitle">True Scale Simulation</span>
            </header>

            <div class="control-header">
                <h3>Simulation Controls</h3>
                <span class="status-badge" id="sim-status">Nominal Gravity</span>
            </div>
            
            <div class="slider-container">
                <div class="slider-label">
                    <span class="material-symbols-outlined">schedule</span>
                    <span>Time Speed (1 Month/sec max)</span>
                </div>
                <input type="range" id="time-slider" min="1" max="2592000" value="604800">
            </div>

            <div class="focus-section">
                <div class="slider-label">
                    <span class="material-symbols-outlined">my_location</span>
                    <span>Focus Camera</span>
                </div>
                <div class="chip-container" id="planet-chips">
                    <!-- Chips generated via JS -->
                </div>
            </div>
        </div>

        <!-- Floating Action Button -->
        <button class="fab" id="sun-toggle" title="What if the Sun disappeared?">
            <span class="material-symbols-outlined" id="sun-icon">wb_sunny</span>
        </button>
        
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
